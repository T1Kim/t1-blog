<script>
  (function() {
    const filters = { period: 'all', theme: 'all', camera: 'all' };
    const grid = document.getElementById('lightGallery');

    // [로직 1] YYYY.MM 포맷을 상단 필터 카테고리로 변환하는 함수
    function parsePeriodToCategory(dateStr) {
      if (!dateStr) return 'unknown';
      const year = parseInt(dateStr.split('.')[0], 10);
      if (isNaN(year)) return 'unknown';

      if (year <= 2010) return '~2010';
      if (year >= 2011 && year <= 2020) return '2011~2020';
      if (year >= 2021 && year <= 2030) return '2021~2030';
      return 'unknown';
    }

    // JSON 데이터 호출
    fetch('gallery.json')
      .then(res => {
        if (!res.ok) throw new Error("Data load failed");
        return res.json();
      })
      .then(data => {
        data.forEach(item => {
          // [로직 2] 입력된 원본 날짜를 카테고리로 변환하여 data-computed-period 속성에 주입
          const computedCategory = parsePeriodToCategory(item.period);

          const el = document.createElement('div');
          el.className = 'gallery-item';
          el.setAttribute('data-computed-period', computedCategory);
          el.setAttribute('data-theme', item.theme);
          el.setAttribute('data-camera', item.camera);

          // 하마다 히데아키 스타일을 위한 메타데이터 마크업 생성
          el.innerHTML = `
            <img src="${item.image}" alt="${item.title}" loading="lazy">
            <div class="item-overlay">
              <div class="item-title">${item.title} (${item.period})</div>
              <div class="item-desc">${item.desc}</div>
            </div>
          `;
          grid.appendChild(el);
        });

        initFilters();
      })
      .catch(err => {
        grid.innerHTML = `<p style="color:#86868b; text-align:center; padding: 2rem 0;">데이터 파이프라인 연결 오류</p>`;
      });

    function initFilters() {
      const filterRows = document.querySelectorAll('.filter-row');
      const items = document.querySelectorAll('.gallery-item');

      filterRows.forEach(row => {
        const group = row.getAttribute('data-filter-group');
        const buttons = row.querySelectorAll('.filter-btn');

          buttons.forEach(btn => {
            btn.addEventListener('click', () => {
              buttons.forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              filters[group] = btn.getAttribute('data-filter');
              
              items.forEach(item => {
                // 변환된 계산값(data-computed-period)을 기준으로 필터 매칭 실행
                const mPeriod = (filters.period === 'all' || filters.period === item.getAttribute('data-computed-period'));
                const mTheme = (filters.theme === 'all' || filters.theme === item.getAttribute('data-theme'));
                const mCamera = (filters.camera === 'all' || filters.camera === item.getAttribute('data-camera'));

                if (mPeriod && mTheme && mCamera) {
                  item.classList.remove('hidden');
                } else {
                  item.classList.add('hidden');
                }
              });
            });
          });
        });
      }
    })();
</script>

              gutterDiv.style.top = top - 2 + "px";
              gutterDiv.style.height = height + 4 + "px";
            }
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {
          elRect = undefined;
          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
  </script>
