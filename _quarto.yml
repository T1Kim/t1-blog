project:
  type: website
  output-dir: _site
  resources:
    - gallery/gallery.json  # 위치를 gallery 폴더 내부로 갱신
    - assets/gallery/

website:
  title: "Invest For Me"
  site-url: "https://T1Kim.github.io/t1-blog/"
  navbar:
    background: "#1d1d1f" # Apple 다크 그레이
    search: true
    left:
      - href: index.qmd
        text: Home
      - href: investment/index.qmd
        text: Investment
      - href: hobbies/index.qmd
        text: Hobbies
      - href: gallery/index.qmd
        text: Gallery
      - href: blog/index.qmd
        text: Blog

format:
  html:
    theme: cosmo # 'none' 대신 표준 테마인 'cosmo'를 기반으로 삼습니다.
    css: styles.css # 그 위에 T1의 Apple 디자인(styles.css)을 덮어씌웁니다.
    toc: true                # TOC 활성화
    toc-depth: 3             # ###(h3)까지만 표시하여 깔끔함 유지
    toc-location: right      # Apple 공식 문서처럼 우측 배치를 추천
    toc-title: "On this page" # 제목을 담백하게 설정 (또는 "Contents")
    toc-expand: true         # 모든 목차를 처음부터 펼쳐서 보여줄지 여부
    page-layout: article